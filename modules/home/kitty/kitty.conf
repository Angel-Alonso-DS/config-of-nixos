# ============================================================
#  kitty/kitty.conf
#  Configuración de Kitty — Terminal principal
#  Paleta: Aether Dark (coherente con Hyprland)
# ============================================================

# ------------------------------------------------------------
#  Fuente
# ------------------------------------------------------------

font_family      JetBrains Mono
bold_font        JetBrains Mono Bold
italic_font      JetBrains Mono Italic
bold_italic_font JetBrains Mono Bold Italic

# Alternativa si JetBrains Mono no está instalado:
# font_family Fira Code
# font_family Hack Nerd Font

font_size        13.0

# Ligaduras (opcional — descomenta si quieres ligaduras de código)
# disable_ligatures never

# Ajuste de métricas de fuente (subpíxel)
adjust_line_height  2
adjust_column_width 0

# ------------------------------------------------------------
#  Cursor
# ------------------------------------------------------------

cursor_shape          beam
cursor_blink_interval 0.5
cursor_stop_blinking_after 15.0

# Color del cursor (usa el acento principal)
# cursor #7c8cf8
# cursor_text_color background

# ------------------------------------------------------------
#  Rendimiento
# ------------------------------------------------------------

# Sincronizar con el framerate del compositor (VSync)
sync_to_monitor yes

# Número de líneas en el historial de scroll
scrollback_lines 10000

# Intervalo de redibujado mínimo (ms) — 0 = lo más rápido posible
repaint_delay 8

# Latencia de entrada
input_delay 3

# ------------------------------------------------------------
#  Ventana
# ------------------------------------------------------------

# Sin decoraciones de ventana (Hyprland gestiona bordes)
hide_window_decorations yes

# Padding interno de la terminal (px)
window_padding_width 10

# Recordar tamaño de ventana
remember_window_size yes
initial_window_width  120c
initial_window_height 30c

# Confirmar antes de cerrar si hay procesos activos
confirm_os_window_close 1

# ------------------------------------------------------------
#  Pestañas (tabs)
#  Nota: Si usas grupos de Hyprland, las tabs de Kitty son
#  redundantes. Elige uno u otro.
# ------------------------------------------------------------

tab_bar_edge bottom
tab_bar_style powerline
tab_powerline_style slanted
tab_bar_min_tabs 2

# Colores de tabs
# active_tab_foreground   #d8dde8
# active_tab_background   #7c8cf8
active_tab_font_style   bold
# inactive_tab_foreground #505a6e
# inactive_tab_background #1e2330
inactive_tab_font_style normal

tab_title_template "{index}: {title}"

# ------------------------------------------------------------
#  URLs — Detección y apertura
# ------------------------------------------------------------
# url_color #7c8cf8
url_style curly
open_url_with xdg-open
detect_urls yes

# Clic en URLs sin modificador
mouse_map ctrl+left release grabbed,ungrabbed mouse_click_url

# ------------------------------------------------------------
#  Portapapeles
# ------------------------------------------------------------

# Copiar al portapapeles al seleccionar texto
copy_on_select yes

# Pegar con Shift+Insert
map shift+insert paste_from_clipboard

# Copiar/pegar estándar
map ctrl+shift+c copy_to_clipboard
map ctrl+shift+v paste_from_clipboard

# ------------------------------------------------------------
#  Atajos de teclado de Kitty
# ------------------------------------------------------------

# Aumentar/reducir tamaño de fuente
map ctrl+shift+equal  change_font_size all +1.0
map ctrl+shift+minus  change_font_size all -1.0
map ctrl+shift+0      change_font_size all 0

# Scroll
map ctrl+shift+up    scroll_line_up
map ctrl+shift+down  scroll_line_down
map ctrl+shift+page_up   scroll_page_up
map ctrl+shift+page_down scroll_page_down
map ctrl+shift+home  scroll_home
map ctrl+shift+end   scroll_end

# Nueva ventana/tab
map ctrl+shift+t     new_tab_with_cwd
map ctrl+shift+enter new_window_with_cwd
map ctrl+shift+w     close_tab

# Navegación de tabs
map ctrl+shift+right next_tab
map ctrl+shift+left  previous_tab
map ctrl+shift+1     goto_tab 1
map ctrl+shift+2     goto_tab 2
map ctrl+shift+3     goto_tab 3
map ctrl+shift+4     goto_tab 4
map ctrl+shift+5     goto_tab 5

# Pantalla completa
map ctrl+shift+f11   toggle_fullscreen

# Editar configuración
map ctrl+shift+f2    edit_config_file

# Recargar configuración
map ctrl+shift+f5    load_config_file

# Mostrar debug info
map ctrl+shift+f6    debug_config

# ------------------------------------------------------------
#  Paleta de colores — Aether Dark
# ------------------------------------------------------------

background_opacity 0.9

# Background / Foreground
# background            #131720
# foreground            #d8dde8
# selection_background  #252d3d
# selection_foreground  #edf0f5

# Cursor
# cursor                #7c8cf8
# cursor_text_color     #0f1117

# Colores ANSI estándar (0-7 normales, 8-15 brillantes)
# Black
# color0  #1e2330
# color8  #3c4758
# Red
# color1  #e06c75
# color9  #e8858d
# Green
# color2  #89d88b
# color10 #a3e0a5
# Yellow / Amber
# color3  #f0a05a
# color11 #f5b87c
# Blue / Lavender
# color4  #7c8cf8
# color12 #9aa8fa
# Magenta / Mauve
# color5  #a988e8
# color13 #bda0ee
# Cyan / Teal
# color6  #4ec9a8
# color14 #70d6b8
# White
# color7  #a2aab8
# color15 #d8dde8

# ------------------------------------------------------------
#  Integración con el sistema
# ------------------------------------------------------------

# Shell a usar (detecta el predeterminado del usuario)
shell .

# Directorio inicial (usa el del proceso padre)
# Si quieres forzar un directorio: /home/user/projects
# listen_on unix:/tmp/kitty

# Nivel de acceso a la clipboard (para compatibilidad con neovim)
clipboard_control write-clipboard write-primary read-clipboard-ask read-primary-ask

# Soporte de OSC (para integración con shells modernos)
allow_remote_control yes
listen_on unix:/tmp/kitty-{kitty_pid}


# BEGIN_KITTY_THEME
# Catppuccin-Mocha
include current-theme.conf
# END_KITTY_THEME
