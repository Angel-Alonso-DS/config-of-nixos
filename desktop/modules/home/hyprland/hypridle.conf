# hypridle.conf — formato hyprlang clásico (NO Lua, hypridle es un
# proyecto hermano de Hyprland, no ha migrado). CONFIRMADO como causa
# raíz de ~29 crashes desde el 3 de julio: este archivo es obligatorio,
# hypridle aborta si no existe (fuente: wiki.hypr.land/Hypr-Ecosystem/hypridle).

general {
    lock_cmd = pidof hyprlock || hyprlock  # evita múltiples instancias
    before_sleep_cmd = loginctl lock-session  # bloquear antes de suspender
    # Sintaxis de dispatch confirmada para Hyprland 0.55+ con Lua: hay
    # que pasar la llamada real, no el nombre suelto (mismo bug que ya
    # encontramos con "hyprctl dispatch exit").
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({ action = "enable" })'
    ignore_dbus_inhibit = false
    ignore_systemd_inhibit = false
}

# Bloquear pantalla tras 5 min de inactividad
listener {
    timeout = 300
    on-timeout = loginctl lock-session
}

# Apagar pantalla (DPMS off) tras 5.5 min — poco después del bloqueo
listener {
    timeout = 330
    on-timeout = hyprctl dispatch 'hl.dsp.dpms({ action = "disable" })'
    on-resume = hyprctl dispatch 'hl.dsp.dpms({ action = "enable" })'
}

# Suspender tras 30 min de inactividad total
listener {
    timeout = 1800
    on-timeout = systemctl suspend
}
