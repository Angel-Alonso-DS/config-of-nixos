# ============================================================
#  hyprlock.conf — diseño minimalista, paleta personalizada
#  background     #0A131D
#  background-alt #16283A
#  foreground     #DBF7F5
#  selected/active #68DDDD
#  urgent         #E08585
# ============================================================

# ---------------------------------------------------------
# FONDO
# Blur mínimo: tu rofi/waybar son flat y nítidos, no glass.
# ---------------------------------------------------------
background {
    monitor =
    path = screenshot
    blur_passes = 2
    blur_size = 3
    contrast = 0.9
    brightness = 0.6
    vibrancy = 0.1
}

general {
    no_fade_in = false
    grace = 0
    hide_cursor = true
    disable_loading_bar = true
}

# ---------------------------------------------------------
# RELOJ
# ---------------------------------------------------------
label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%H:%M")"
    color = rgba(DBF7F5FF)
    font_size = 76
    font_family = Cascadia Code
    position = 0, 170
    halign = center
    valign = center
}

# ---------------------------------------------------------
# FECHA
# ---------------------------------------------------------
label {
    monitor =
    text = cmd[update:60000] echo "$(date +"%A, %B %d")"
    color = rgba(DBF7F5B3)
    font_size = 18
    font_family = Cascadia Code
    position = 0, 108
    halign = center
    valign = center
}

# ---------------------------------------------------------
# TARJETA CENTRAL — panel flat sólido, sin borde, rounding
# discreto (estilo rofi: sin glass, sin líneas divisorias).
# 320x190 en (0, -100) → top=-5, bottom=-195
# ---------------------------------------------------------
shape {
    monitor =
    size = 320, 190
    color = rgba(16283AF2)
    rounding = 12
    border_size = 0
    position = 0, -100
    halign = center
    valign = center
}

# Indicador de usuario: chip sólido cian, como el icono de
# settings o la fila seleccionada de tu rofi (bloque de color
# plano, no translúcido).
shape {
    monitor =
    size = 10, 10
    color = rgba(68DDDDFF)
    rounding = 5
    border_size = 0
    position = -70, -50
    halign = center
    valign = center
}

# USUARIO (dentro de la tarjeta, arriba)
label {
    monitor =
    text = $USER
    color = rgba(DBF7F5E6)
    font_size = 18
    font_family = Cascadia Code
    position = 0, -50
    halign = center
    valign = center
}

# ---------------------------------------------------------
# INPUT FIELD (dentro de la tarjeta, abajo)
# Con feedback de estado: normal / caps lock / error
# ---------------------------------------------------------
input-field {
    monitor =
    size = 280, 50
    rounding = 10
    outline_thickness = 2
    outer_color = rgba(0A131DFF)
    inner_color = rgba(0A131DFF)
    font_color = rgba(DBF7F5FF)
    font_family = Cascadia Code
    placeholder_text = <i>Ingresa tu contraseña</i>
    fade_on_empty = false
    hide_input = false
    check_color = rgba(68DDDDFF)
    fail_color = rgba(E08585FF)
    fail_text = <i>Contraseña incorrecta</i>
    capslock_color = rgba(E08585FF)
    position = 0, -150
    halign = center
    valign = center
}
